<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pixel Polizist</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100dvh;
    overflow: hidden;
    font-family: monospace;
    touch-action: none;
  }
  #gameContainer {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  #canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    border: 3px solid #4a90d9;
    box-shadow: 0 0 20px #4a90d955;
  }
  #ui {
    width: 100%;
    display: flex;
    gap: 8px;
    padding: 0 4px;
  }
  .stat-bar {
    flex: 1;
    background: #0d1b2a;
    border: 2px solid #4a90d9;
    border-radius: 4px;
    padding: 4px 6px;
  }
  .stat-label {
    color: #a0c4e8;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .stat-track {
    background: #0a0f1a;
    height: 8px;
    border-radius: 2px;
    margin-top: 3px;
    overflow: hidden;
  }
  .stat-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.3s;
  }
  #controls {
    display: grid;
    grid-template-areas:
      ". up ."
      "left . right"
      ". down .";
    grid-template-columns: 60px 60px 60px;
    grid-template-rows: 60px 60px 60px;
    gap: 4px;
  }
  .btn {
    background: #1e3a5f;
    border: 2px solid #4a90d9;
    border-radius: 8px;
    color: #a0c4e8;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    active-background: #2a5090;
  }
  .btn:active { background: #2a5090; }
  #btnUp    { grid-area: up; }
  #btnLeft  { grid-area: left; }
  #btnRight { grid-area: right; }
  #btnDown  { grid-area: down; }
  #actionRow {
    display: flex;
    gap: 12px;
    margin-top: 4px;
  }
  #btnAction {
    background: #3a1f5f;
    border: 2px solid #9b59b6;
    border-radius: 50%;
    width: 56px; height: 56px;
    color: #e0b0ff;
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #btnAction:active { background: #5a2f8f; }
  #dialogBox {
    display: none;
    position: absolute;
    bottom: 0;
    left: 0; right: 0;
    background: #0d1b2a;
    border-top: 3px solid #4a90d9;
    padding: 10px 14px 8px;
    min-height: 80px;
  }
  #dialogText {
    color: #e8f4fd;
    font-size: 13px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  #dialogContinue {
    color: #4a90d9;
    font-size: 11px;
    text-align: right;
    margin-top: 4px;
    animation: blink 0.8s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  #floorLabel {
    position: absolute;
    top: 6px; right: 8px;
    background: #0d1b2acc;
    color: #4a90d9;
    font-size: 10px;
    padding: 2px 6px;
    border: 1px solid #4a90d9;
    border-radius: 3px;
  }
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="canvas"></canvas>
  <div id="ui">
    <div class="stat-bar">
      <div class="stat-label">Kraft 💪</div>
      <div class="stat-track"><div class="stat-fill" id="barKraft" style="background:#e74c3c"></div></div>
    </div>
    <div class="stat-bar">
      <div class="stat-label">Hunger 🍱</div>
      <div class="stat-track"><div class="stat-fill" id="barHunger" style="background:#f39c12"></div></div>
    </div>
    <div class="stat-bar">
      <div class="stat-label">Energie ⚡</div>
      <div class="stat-track"><div class="stat-fill" id="barEnergie" style="background:#2ecc71"></div></div>
    </div>
  </div>
  <div style="display:flex; gap:24px; align-items:flex-end;">
    <div id="controls">
      <button class="btn" id="btnUp">▲</button>
      <button class="btn" id="btnLeft">◀</button>
      <button class="btn" id="btnRight">▶</button>
      <button class="btn" id="btnDown">▼</button>
    </div>
    <div id="actionRow">
      <button id="btnAction">A<br>Aktion</button>
    </div>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
